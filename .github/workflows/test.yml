name: selftest

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt
      - name: Compile Python
        run: python -m py_compile storis.py selftest.py engine/*.py
      - name: Render and accept synthetic master
        run: python selftest.py
